[tox]
minversion = 2.0
# avoid sdist
skipsdist = True
envlist = py37,py38,pep8

[testenv]
usedevelop = True
deps =
    -c{env:TOX_CONSTRAINTS_FILE:https://raw.githubusercontent.com/sapcc/requirements/stable/zed-m3/upper-constraints.txt}
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/test-requirements.txt
setenv = VIRTUAL_ENV={envdir}
         BRANCH_NAME=master
         CLIENT_NAME=rate-limit
         OS_STDOUT_CAPTURE=1
         OS_STDERR_CAPTURE=1
         OS_TEST_TIMEOUT=60
         TESTS_DIR=./rate_limit/tests/

[testenv:functional]
setenv =
  {[testenv]setenv}
  OS_TEST_PATH=./rate_limit/tests
commands = stestr run {posargs}

[testenv:pep8]
allowlist_externals = flake8
deps =
  {[testenv]deps}
  pylint==2.5.3 # GPLv2
commands = flake8

[testenv:venv]
commands = {posargs}

[flake8]
ignore = D100,D101,D102,D103,D104,D203,D205,W605
show-source = True
exclude = .git,__pycache__,docs/source/conf.py,old,build,dist,*.egg,.tox,venv,.venv
max-line-length = 140

[testenv:docs]
deps = -r{toxinidir}/doc/requirements.txt
commands=
    doc8 doc/source
    python setup.py build_sphinx

[testenv:releasenotes]
commands = sphinx-build -a -E -W -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html

[hacking]
import_exceptions =
    rate_limit.i18n

[doc8]
extensions = .rst, .yaml
# lines should not be longer than 79 characters.
max-line-length = 140
